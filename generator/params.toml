# Baseline parameters for the synthetic UK online retailer.
#
# This file only describes "business as usual". The planted stories live in
# ../sealed/scenario.toml (git-ignored until Day 11). Without that file the
# generator still runs and produces a plain, story-free business.

seed  = 42
scale = 1.0   # 1.0 ≈ 8M rows in total. Override with --scale for test runs.

# Marketing channels.
#   acquire = mix for a customer's first order
#   repeat  = mix for repeat orders
#   browse  = mix for non-converting traffic (high browse vs. order share = low conversion)
channel = [
  { name = "Organic Search", acquire = 0.22, repeat = 0.15, browse = 0.26 },
  { name = "Paid Search",    acquire = 0.28, repeat = 0.12, browse = 0.14 },
  { name = "Paid Social",    acquire = 0.18, repeat = 0.07, browse = 0.20 },
  { name = "Email",          acquire = 0.00, repeat = 0.25, browse = 0.05 },
  { name = "Affiliate",      acquire = 0.10, repeat = 0.05, browse = 0.04 },
  { name = "Display",        acquire = 0.04, repeat = 0.01, browse = 0.06 },
  { name = "Referral",       acquire = 0.09, repeat = 0.04, browse = 0.05 },
  { name = "Direct",         acquire = 0.07, repeat = 0.31, browse = 0.20 },
]

[calendar]
warmup_start = 2021-01-01   # simulated but not written: gives day 1 an existing customer base
start        = 2023-01-01   # first day written to RAW
end          = 2026-09-30   # last day written to RAW

[acquisition]
new_per_day   = 55     # new customers per day on `start` (at scale 1.0)
annual_growth = 0.22   # year-on-year growth in new-customer volume

[seasonality]
#         Jan   Feb   Mar   Apr   May   Jun   Jul   Aug   Sep   Oct   Nov   Dec
month   = [1.05, 0.85, 0.90, 0.92, 0.92, 0.90, 0.95, 0.90, 0.95, 1.00, 1.35, 1.30]
#         Mon   Tue   Wed   Thu   Fri   Sat   Sun
weekday = [1.05, 1.00, 1.00, 1.00, 0.95, 0.90, 1.10]
# Relative activity by hour of day, 00:00 → 23:00 (normalised in code)
hour = [0.8, 0.5, 0.3, 0.2, 0.2, 0.3, 0.8, 1.6, 2.6, 3.4, 4.0, 4.4,
        5.0, 5.0, 4.6, 4.4, 4.6, 5.0, 5.8, 6.8, 7.4, 6.8, 5.2, 2.8]

# Customer value tiers. They drive basket size, how often people come back, and churn.
[tiers]
names         = ["low", "mid", "high"]
share         = [0.45, 0.40, 0.15]
mean_lines    = [1.4, 2.3, 3.3]      # average product lines per order
mean_gap_days = [120, 85, 45]        # average days between orders (before seasonal thinning)
gap_shape     = 1.5                  # gamma shape: lower = more irregular gaps
churn_prob    = [0.55, 0.42, 0.28]   # chance of never ordering again after each order

[sales_channel]
names   = ["web", "app", "marketplace"]
share   = [0.55, 0.30, 0.15]
loyalty = 0.80   # chance an order uses the customer's usual sales channel

[devices]
web       = ["desktop", "mobile_web"]
web_share = [0.45, 0.55]
app       = ["ios_app", "android_app"]
app_share = [0.60, 0.40]
loyalty   = 0.75

# Baseline session → order conversion rate by device
[conversion_rate]
desktop     = 0.038
mobile_web  = 0.019
ios_app     = 0.045
android_app = 0.036

[products]
count                 = 2500
brands_per_category   = 10
popularity_exponent   = 0.9    # Zipf-like: a few best-sellers, a long tail
launched_before_share = 0.70   # share of the range already on sale before the simulation starts
discontinued_share    = 0.20

[orders]
max_lines              = 8
quantity               = [1, 2, 3]
quantity_share         = [0.86, 0.11, 0.03]
annual_price_inflation = 0.03    # list prices are "today's"; older orders were cheaper
same_delivery_address  = 0.95
cancel_rate            = 0.025
offsite_promo_uptake   = 0.25    # promo use when not arriving via a campaign channel (× campaign uptake)
pad_categories         = ["Beauty", "Books", "Home", "Kids"]   # items people add to reach free delivery

[payment]
methods   = ["card", "paypal", "klarna", "apple_pay"]
share     = [0.58, 0.22, 0.14, 0.06]
ios_share = [0.40, 0.15, 0.10, 0.35]

[sessions]
prior_per_order      = 1.0     # average earlier "research" visits before an order
prior_max_days       = 14
logged_in_share      = 0.6     # share of research visits where the customer is logged in
prior_basket_rate    = 0.20
browse_basket_rate   = 0.07
campaign_click_share = 0.7     # share of campaign-channel traffic tagged with the campaign code
ip_area_accuracy     = 0.9     # IP geolocation picks the right postcode area this often
landing_pages        = ["home", "category", "product", "search"]
landing_share        = [0.30, 0.25, 0.30, 0.15]

[returns]
window_days   = 30
partial_share = 0.3      # multi-unit lines: chance only some units come back
dispatch_days = [1, 3]

# Delivery charge: free at or above the threshold (basket inc. VAT, after discount).
# Customers just below the threshold sometimes add an item to reach it.
[[shipping_policy]]
start      = 2021-01-01
threshold  = 40.0
fee        = 3.99
pad_window = 10.0
pad_prob   = 0.25

[marketing]
always_on            = { "Paid Search" = 1400.0, "Paid Social" = 650.0, "Display" = 280.0, "Email" = 45.0 }
cpc                  = { "Paid Search" = 0.85, "Paid Social" = 0.55, "Display" = 0.35, "Email" = 0.02, "Affiliate" = 0.40 }
ctr                  = { "Paid Search" = 0.045, "Paid Social" = 0.012, "Display" = 0.002, "Email" = 0.03, "Affiliate" = 0.01 }
affiliate_commission = 0.08     # affiliates are paid 8% of the net revenue they drive
campaign_email_share = 0.05     # share of a campaign's daily budget spent on email

# Campaign calendar, repeated every year. {yy}/{yyyy}/{mm}/{mon} are filled in per year.
# discount = headline % off; uptake = share of campaign-channel orders using the code;
# acquisition_lift = new-customer multiplier while live; pull_forward = repeat orders moved into the window.
[[campaign_template]]
code = "JAN{yy}"
name = "January Sale {yyyy}"
type = "Seasonal sale"
start = "01-02"
days = 14
discount = 0.20
channels = ["Email", "Paid Search", "Paid Social", "Display"]
uptake = 0.5
acquisition_lift = 1.3
pull_forward_prob = 0.10
pull_forward_days = 21
spend_per_day = 1800

